# Render blueprint for the API, on the free tier.
#
# Deploy with Render's "New > Blueprint" against this repository.
#
# The database is deliberately NOT declared here. Render's free Postgres is
# deleted after 30 days, which is a data loss with a timer on it. Neon's free
# tier has no such expiry, so the database lives there and this service is
# given its URL. Neon speaks TLS, which config/settings.py requires whenever
# DJANGO_DEBUG is off — so DJANGO_DB_SSL_REQUIRE stays at its default.
#
# What "free" costs: the web service sleeps after 15 minutes with no traffic,
# and the next visitor waits roughly 50 seconds for it to wake. Fine while
# testing, poor for customers. Changing `plan: free` to `plan: starter` below
# removes the sleeping, and is the only edit needed.
#
# After the first deploy, put the service's hostname into the /api rewrite in
# vercel.json — that rewrite is what keeps the browser on one origin, which is
# what keeps the session cookie first-party and working in Safari.

services:
  - type: web
    name: plsm-api
    runtime: docker
    # Frankfurt rather than Oregon: the customers are in the Netherlands and
    # the Caribbean, and the data stays in the EU. Pick Neon's EU region too,
    # so every query is not a round trip across the Atlantic.
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    # The Dockerfile copies from its own directory and expects to be built
    # with backend/ as the root.
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      # Off, and it must stay off. With DEBUG on, Django serves tracebacks
      # containing settings and source to anyone who triggers an error.
      - key: DJANGO_DEBUG
        value: "0"

      # Generated once by Render and then held. Regenerating it signs out
      # every user and invalidates every outstanding password-reset link.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # The hostname Render assigns, filled in automatically. Without the
      # right value here Django answers every request with 400 Bad Request.
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: plsm-api
          property: host

      # The origin the site is served from. settings.py adds this to both
      # CORS_ALLOWED_ORIGINS and CSRF_TRUSTED_ORIGINS on its own, which is
      # what lets a POST from the Vercel origin pass Django's CSRF check.
      # Change this to https://paylesshopmore.com once the domain moves.
      - key: DJANGO_FRONTEND_URL
        value: https://pay-les-shop-more.vercel.app

      # Paste Neon's connection string into the Render dashboard. sync: false
      # means the blueprint asks for it rather than carrying it in git, which
      # is right: it contains the database password.
      - key: DATABASE_URL
        sync: false

      # Short on purpose for the first deploy. HSTS is cached by the browser
      # and cannot be withdrawn early, so a wrong year-long value is a year
      # of a domain that refuses plain HTTP. Raise it once HTTPS is settled.
      - key: DJANGO_HSTS_SECONDS
        value: "300"

      # Do not set CELERY_BROKER_URL until a worker exists to consume the
      # queue: with a broker set and no worker, tasks are queued and never
      # run, and the invoice mail silently never arrives. Unset, settings.py
      # runs them inline (CELERY_TASK_ALWAYS_EAGER), which is what the free
      # tier wants anyway.

      # Do not set PORT. Render injects it and the Dockerfile reads it.
