# Linting and formatting for the Django side, run by `ruff` in CI.
#
# Ruff rather than flake8 plus isort plus pyupgrade: one tool, one config, and
# fast enough that the pre-push hook does not become the reason nobody uses
# the pre-push hook.
#
#     python -m ruff check .          # what CI runs
#     python -m ruff check --fix .    # fix what can be fixed mechanically
#     python -m ruff format .         # not gated; see the note at the bottom

target-version = "py312"

# 120, because that is what this codebase already writes. Nothing here was
# reflowed to adopt the linter: at 100 there were twenty-odd lines over, all
# of them between 101 and 119 characters, and rewrapping working code to
# satisfy a number picked after the fact is churn with no reader on the other
# end of it.
line-length = 120

exclude = [
    ".venv",
    # Generated by makemigrations and edited approximately never. Django
    # writes them past any line length and with its own import order; linting
    # them means reformatting a file the framework will rewrite next time.
    "**/migrations",
    # Collected by collectstatic. Not ours.
    "staticfiles",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: undefined names, unused imports, f-strings with no placeholder
    "I",   # isort: import order, so a merge conflict in an import block is rare
    "UP",  # pyupgrade: syntax that 3.12 has a better form for
    "B",   # bugbear: mutable default arguments, loop-variable capture, raise-without-from
    "DJ",  # Django-specific: null=True on a CharField, missing __str__, and so on
    "C4",  # comprehensions that build a list only to throw it away
]

ignore = [
    # zip() without strict=. Whether a length mismatch should raise is a
    # decision per call site, not a default: the three places this fires are
    # zipping a queryset against a list derived from it, where the lengths are
    # equal by construction and strict=True would add a branch that cannot be
    # tested. Revisit per call site, not in bulk.
    "B905",
    # The Django style guide's ordering of fields, managers and methods inside
    # a model. Correct as taste, but it moves code without changing behaviour,
    # and a diff that reorders a model is a diff nobody can review usefully.
    "DJ012",
]

[lint.per-file-ignores]
# Settings legitimately does `from .base import *`-shaped things and defines
# names that nothing in the module itself reads.
"config/settings.py" = ["F403", "F405"]

[lint.isort]
# Treated as first-party so that app imports sort into their own block rather
# than being mixed in with site-packages.
known-first-party = [
    "accounts",
    "bookings",
    "config",
    "enquiries",
    "invoicing",
    "notifications",
    "staff",
    "warehouse",
]

# `ruff format` is deliberately NOT part of CI. The formatter would reflow
# every docstring and comment in this repository, and the comments here are
# written to be read as prose. Run it on a file you are already rewriting if
# you like; do not run it across the tree.
